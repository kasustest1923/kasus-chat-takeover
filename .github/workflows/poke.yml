name: poke
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "k"
          git config user.email "k@users.noreply.github.com"
          git commit --allow-empty -m rebuild
          git push
